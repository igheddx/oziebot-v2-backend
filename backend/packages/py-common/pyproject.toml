[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oziebot-common"
version = "0.1.0"
description = "Shared queue helpers and Postgres-backed runtime primitives"
requires-python = ">=3.12"
dependencies = [
  "oziebot-domain",
  "boto3>=1.34",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oziebot_common"]
