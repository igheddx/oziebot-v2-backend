x-teacher-assist-env: &teacher-assist-env
  TEACHER_ASSIST_STORAGE_BACKEND: ${TEACHER_ASSIST_STORAGE_BACKEND:-local}
  TEACHER_ASSIST_STORAGE_ROOT: ${TEACHER_ASSIST_STORAGE_ROOT:-/tmp/oziebot-teacher-assist}
  TEACHER_ASSIST_S3_BUCKET: ${TEACHER_ASSIST_S3_BUCKET:-}
  TEACHER_ASSIST_S3_REGION: ${TEACHER_ASSIST_S3_REGION:-}
  TEACHER_ASSIST_S3_PREFIX: ${TEACHER_ASSIST_S3_PREFIX:-teacher-assist}
  TEACHER_ASSIST_S3_ENDPOINT: ${TEACHER_ASSIST_S3_ENDPOINT:-}
  TEACHER_ASSIST_S3_PRESIGN_EXPIRATION_SECONDS: ${TEACHER_ASSIST_S3_PRESIGN_EXPIRATION_SECONDS:-900}
  TEACHER_ASSIST_OCR_PROVIDER: ${TEACHER_ASSIST_OCR_PROVIDER:-mock}
  TEACHER_ASSIST_REAL_OCR_ENABLED: ${TEACHER_ASSIST_REAL_OCR_ENABLED:-false}
  TEACHER_ASSIST_OCR_DAILY_COST_LIMIT_CENTS: ${TEACHER_ASSIST_OCR_DAILY_COST_LIMIT_CENTS:-0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oziebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oziebot}
      POSTGRES_DB: ${POSTGRES_DB:-oziebot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oziebot} -d ${POSTGRES_DB:-oziebot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-min-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://app.oziebot.com}
      <<: *teacher-assist-env
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  teacher-assist-worker:
    build:
      context: .
      dockerfile: backend/services/teacher-assist-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      TEACHER_ASSIST_WORKER_ENABLED: ${TEACHER_ASSIST_WORKER_ENABLED:-true}
      TEACHER_ASSIST_WORKER_POLL_INTERVAL_SECONDS: ${TEACHER_ASSIST_WORKER_POLL_INTERVAL_SECONDS:-1.0}
      <<: *teacher-assist-env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  strategy-engine:
    build:
      context: .
      dockerfile: backend/services/strategy-engine/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OZIEBOT_STRATEGY_DEMO: ${OZIEBOT_STRATEGY_DEMO:-1}
      OZIEBOT_TRADING_MODE: ${OZIEBOT_TRADING_MODE:-paper}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  risk-engine:
    build:
      context: .
      dockerfile: backend/services/risk-engine/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  execution-engine:
    build:
      context: .
      dockerfile: backend/services/execution-engine/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  alerts-worker:
    build:
      context: .
      dockerfile: backend/services/alerts-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-data-ingestor:
    build:
      context: .
      dockerfile: backend/services/market-data-ingestor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oziebot:oziebot@postgres:5432/oziebot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COINBASE_WS_URL: ${COINBASE_WS_URL:-wss://advanced-trade-ws.coinbase.com}
      COINBASE_REST_URL: ${COINBASE_REST_URL:-https://api.exchange.coinbase.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
