# Single source of truth: host **must** come from repository Variables (LEAN_EC2_HOST).
# Older workflows sometimes hard-coded an IP → wrong host and SSH timeouts.

name: Deploy Backend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

# One deploy at a time; cancel an in-flight run when a newer push lands on main.
concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LEAN_REPO_PATH_ON_HOST: ${{ vars.LEAN_EC2_REPO_PATH }}
      EC2_USER: ${{ vars.LEAN_EC2_USER }}
      EC2_HOST: ${{ vars.LEAN_EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow configuration
        run: |
          set -euo pipefail
          test -n "${LEAN_REPO_PATH_ON_HOST}" \
            || { echo "::error::Set repository variable LEAN_EC2_REPO_PATH"; exit 1; }
          test -n "${EC2_USER:-}" \
            || { echo "::error::Set repository variable LEAN_EC2_USER"; exit 1; }
          test -n "${EC2_HOST:-}" \
            || { echo "::error::Set repository variable LEAN_EC2_HOST"; exit 1; }

      - name: Show SSH target (from Variables only — no hard-coded IP)
        run: |
          echo "LEAN_EC2_HOST (from repo Variable) = ${{ vars.LEAN_EC2_HOST }}"
          echo "Effective SSH target = ${EC2_USER}@${EC2_HOST}"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LEAN_EC2_SSH_PRIVATE_KEY }}

      - name: Add SSH host fingerprint
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Ensure EC2 bind dirs exist before docker run
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '${LEAN_REPO_PATH_ON_HOST}' '${LEAN_REPO_PATH_ON_HOST}/infrastructure/lean' '${LEAN_REPO_PATH_ON_HOST}/infrastructure/aws'"

      - name: Copy application files to EC2 and start Compose
        env:
          LEAN_REPO_PATH: ${{ vars.LEAN_EC2_REPO_PATH }}
          LEAN_SSH: '${{ vars.LEAN_EC2_USER }}@${{ vars.LEAN_EC2_HOST }}'
          LEAN_USE_EDGE: "1"
        run: |
          set -euo pipefail
          echo "📤 Copying application files to EC2 (${LEAN_SSH})..."
          bash infrastructure/lean/deploy-lean-host.sh --rsync
